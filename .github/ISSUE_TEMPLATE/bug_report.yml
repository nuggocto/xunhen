name: Bug report
description: Something xunhen did wrong, with a synthetic way to reproduce it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach a real undo file or source file.** Undo files keep text you deleted,
        including passwords and keys you removed on purpose, and an issue is public.
        Reproduce the problem with a small synthetic file instead; docs/troubleshooting.md
        shows how. Check docs/troubleshooting.md first: many errors are explained there.
  - type: textarea
    id: version
    attributes:
      label: xunhen version
      description: The complete output of `xunhen version`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: How you installed it
      options:
        - Release archive
        - Nix or NixOS
        - AUR
        - go install
        - Built from a clone
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution and version; for the browser, also the terminal and `TERM`.
      placeholder: Debian 13, kitty 0.43, TERM=xterm-kitty
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and everything it printed, including every `xunhen:` line and the exit status (`echo $?`). Replace private paths if you need to.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Steps that recreate the problem from a new file, such as the Neovim edits to make. Attach a synthetic undo file only after reading its text yourself.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Private data
      options:
        - label: This report contains no real undo file, source file, or recovered text I would not publish.
          required: true
