name: Release

# Pushing an annotated tag vX.Y.Z builds, checks, and stages a draft
# release. Running this workflow by hand on shrek rehearses the same steps
# on a snapshot and stages a draft named rehearsal-COMMIT, which creates no
# tag. Nothing here publishes: publish.yml does that, by hand, from the
# staged bytes. docs/releasing.md describes the whole sequence.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOENV: "off"
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  checks:
    name: Required checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate:
    name: Release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      release: ${{ steps.identity.outputs.release }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag must be annotated, name the built commit, match VERSION, be
      # on shrek, and have its changelog section. A rehearsal must run on
      # shrek itself.
      - name: Check the release identity
        id: identity
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ $EVENT == push ]]; then
            tools/release-identity.sh tag "$TAG" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
          elif [[ $REF == refs/heads/shrek ]]; then
            tools/release-identity.sh rehearsal "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::error::rehearse from shrek, not $REF"
            exit 1
          fi

  archive:
    name: Release archives
    needs: [checks, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sums: ${{ steps.sums.outputs.sha256 }}
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Logs stay outside the checkout: reproduce.sh refuses a working tree
      # with untracked files, since a release must be exactly its commit.
      - name: Build the archives twice and compare them
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          tag=()
          [[ -n $TAG ]] && tag=(-tag "$TAG")
          tools/reproduce.sh "${tag[@]}" .local/reproduce 2>&1 | tee "$RUNNER_TEMP/logs/reproduce.log"
      - name: Verify the binary archive
        run: |
          set -o pipefail
          dir=.local/reproduce/first
          go run ./tools/verify -archive "$dir/xunhen_${VERSION}_linux_amd64.tar.gz" -sums "$dir/SHA256SUMS.txt" \
            -version "v$VERSION" -commit "$COMMIT" -go "$(go env GOVERSION)" 2>&1 | tee "$RUNNER_TEMP/logs/verify.log"
      - name: Record the checksum file's hash
        id: sums
        run: echo "sha256=$(sha256sum .local/reproduce/first/SHA256SUMS.txt | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - name: Collect the artifacts
        run: |
          mkdir staged
          cp .local/reproduce/first/* staged/
          cp .local/reproduce/environment.txt "$RUNNER_TEMP/logs/"
      - name: Keep the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archive
          path: staged/
          if-no-files-found: error
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archive-logs
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

  nix:
    name: Nix package
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The NixOS check boots a virtual machine, which needs KVM.
      - name: Allow access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            sandbox = true
            system-features = nixos-test benchmark big-parallel kvm
      # Every check: the package build with the whole test suite, tools/verify
      # against the packaged executable, a NixOS machine that adds and then
      # removes it through environment.systemPackages, and the packaged
      # executable on Linux 5.10 and a qemu64 CPU.
      - name: Check the flake
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          nix flake check -L 2>&1 | tee "$RUNNER_TEMP/logs/flake-check.log"
      - name: Record the package
        shell: bash
        run: |
          set -o pipefail
          nix build -L .#xunhen
          logs="$RUNNER_TEMP/logs"
          ./result/bin/xunhen --version | tee "$logs/version.txt"
          nix path-info --closure-size --human-readable ./result | tee "$logs/path-info.txt"
          sha256sum ./result/bin/xunhen | tee "$logs/executable.sha256"
      # docs/install.md's user-profile steps: install, remove, roll the
      # removal back, and remove again.
      - name: Install, roll back, and remove in a user profile
        shell: bash
        run: |
          set -euo pipefail
          bin="$HOME/.nix-profile/bin/xunhen"
          nix profile add .#xunhen
          "$bin" --version | tee "$RUNNER_TEMP/logs/profile-version.txt"
          nix profile remove xunhen
          test ! -e "$bin"
          nix profile rollback
          "$bin" --version
          nix profile remove xunhen
          test ! -e "$bin"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nix-logs
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

  # Arch devtools build the recipe in a clean chroot, from the exact source
  # archive the release will publish. systemd-nspawn, which devtools uses,
  # needs a privileged container that shares the runner's cgroups, process
  # namespace, and system bus; the runner is a disposable machine. The
  # same container then installs the package, verifies the installed
  # executable, upgrades, downgrades, and removes it.
  arch:
    name: Arch package
    needs: [validate, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: archive
          path: dist
      - name: Start an Arch container with devtools
        run: |
          mkdir -p logs
          docker run --detach --name arch --privileged --pid=host --cgroupns=host \
            --tmpfs /run --volume /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --volume /run/dbus/system_bus_socket:/run/dbus/system_bus_socket \
            --volume /etc/machine-id:/etc/machine-id:ro \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            archlinux@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50 sleep infinity
          docker exec arch pacman -Syu --noconfirm --needed base-devel devtools namcap git go
          docker exec arch pacman -Q devtools namcap go pacman | tee logs/tools.txt
          docker exec arch useradd --create-home builder
          # builder owns only the directories it builds in; the rest of the
          # workspace stays the runner's, so later steps can write logs.
          docker exec arch install -d -o builder -g builder build rebuild
      - name: Resolve the recipe
        run: |
          docker exec --user builder arch packaging/aur/resolve.sh -version "$VERSION" -commit "$COMMIT" \
            -maintainer "xunhen release workflow" -source "dist/xunhen_${VERSION}_source.tar.gz" -out build
          docker exec --user builder arch cp "dist/xunhen_${VERSION}_source.tar.gz" build/
          cp build/PKGBUILD build/.SRCINFO logs/
      - name: Lint the recipe
        run: docker exec arch namcap build/PKGBUILD | tee logs/namcap-pkgbuild.txt
      - name: Build in a clean chroot
        run: |
          set -o pipefail
          # mkarchroot resolves its directory with readlink -f, which needs
          # the parent to exist.
          docker exec arch mkdir -p /chroot
          # arch-nspawn names its systemd slice after SUDO_USER or USER,
          # which docker exec leaves unset.
          docker exec --env USER=root arch mkarchroot -C /usr/share/devtools/pacman.conf.d/extra.conf \
            -M /usr/share/devtools/makepkg.conf.d/x86_64.conf /chroot/root base-devel >logs/mkarchroot.log 2>&1
          # check() runs the test suite and tools/verify inside the chroot.
          docker exec --env USER=root --workdir /work/build arch makechrootpkg -c -r /chroot -U builder 2>&1 |
            tee logs/makechrootpkg.log
      - name: Lint the package
        run: docker exec arch bash -c 'namcap build/xunhen-[0-9]*.pkg.tar.zst' | tee logs/namcap-package.txt
      - name: Install and verify the package
        run: |
          set -o pipefail
          docker exec arch bash -c 'pacman -U --noconfirm build/xunhen-[0-9]*.pkg.tar.zst'
          docker exec arch pacman -Qi xunhen | tee logs/package-info.txt
          docker exec arch sha256sum /usr/bin/xunhen | tee logs/executable.sha256
          docker exec --user builder arch go run ./tools/verify -binary /usr/bin/xunhen -version "v$VERSION" \
            -commit "$COMMIT" -go "$(docker exec arch go env GOVERSION)" 2>&1 | tee logs/verify-installed.log
      # The package must carry exactly the verified archive's documents,
      # whose relative links the release build checked. It is unpacked
      # rather than read after installing, because the image's pacman.conf
      # skips extracting usr/share/doc. diff follows the links to the
      # license files, which the package carries too.
      - name: Compare the package's documents with the archive
        run: |
          set -o pipefail
          docker exec --env VERSION arch bash -c 'set -euo pipefail
            shipped=$(mktemp -d) packaged=$(mktemp -d)
            tar -xzf "dist/xunhen_${VERSION}_linux_amd64.tar.gz" -C "$shipped" --strip-components=1
            rm "$shipped/xunhen"
            bsdtar -xf build/xunhen-[0-9]*.pkg.tar.zst -C "$packaged"
            diff -r "$shipped" "$packaged/usr/share/doc/xunhen"' | tee logs/package-docs.diff
      # A system whose pacman.conf extracts documentation gets
      # /usr/share/doc/xunhen. Install again without the image's exclusion
      # and follow every relative link the installed documents hold.
      - name: Follow the installed documents' links
        run: |
          set -o pipefail
          docker exec arch bash -c 'set -euo pipefail
            sed "/^NoExtract.*usr\/share\/doc/d" /etc/pacman.conf >/tmp/pacman-docs.conf
            pacman -U --noconfirm --config /tmp/pacman-docs.conf build/xunhen-[0-9]*.pkg.tar.zst >/dev/null
            cd /usr/share/doc/xunhen
            checked=0
            while IFS= read -r doc; do
              while IFS= read -r target; do
                target=${target%%#*}
                [[ -z $target || $target == *://* || $target == mailto:* ]] && continue
                [[ -e $(dirname "$doc")/$target ]] || { echo "$doc links to $target, which is not installed"; exit 1; }
                checked=$((checked + 1))
              done < <(grep -o "\]([^)[:space:]]*)" "$doc" | sed "s/^](//; s/)\$//")
            done < <(find . -name "*.md")
            echo "$checked relative links resolve in $(pwd)"' | tee logs/installed-doc-links.txt
      # docs/install.md's upgrade and downgrade: a second package release
      # of the same source, then back to the first, then removal.
      - name: Upgrade, downgrade, and remove the package
        run: |
          set -euo pipefail
          docker exec --user builder arch packaging/aur/resolve.sh -version "$VERSION" -commit "$COMMIT" \
            -maintainer "xunhen release workflow" -source "dist/xunhen_${VERSION}_source.tar.gz" -pkgrel 2 -out rebuild
          docker exec --user builder arch cp "dist/xunhen_${VERSION}_source.tar.gz" rebuild/
          docker exec --user builder --workdir /work/rebuild arch makepkg --cleanbuild --nocheck --noconfirm >logs/rebuild.log 2>&1
          first=$(find build -name 'xunhen-[0-9]*-1-x86_64.pkg.tar.zst')
          second=$(find rebuild -name 'xunhen-[0-9]*-2-x86_64.pkg.tar.zst')
          docker exec arch pacman -U --noconfirm "$second"
          [[ $(docker exec arch pacman -Q xunhen) == *-2 ]]
          docker exec arch pacman -U --noconfirm "$first"
          [[ $(docker exec arch pacman -Q xunhen) == *-1 ]]
          docker exec arch /usr/bin/xunhen --version
          docker exec arch pacman -R --noconfirm xunhen
          docker exec arch test ! -e /usr/bin/xunhen
      - name: Keep the package and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: arch-results
          path: |
            logs/
            build/*.pkg.tar.zst
          if-no-files-found: ignore

  # docs/qa.md: the archive's executable installed and checked as an
  # ordinary user in each pinned userland, traced for file, process, and
  # network use, and driven in tmux and over SSH. tools/qa.sh runs every
  # check from the archive itself; nothing here builds xunhen.
  qa:
    name: Candidate QA
    needs: [validate, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch the release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: archive
          path: dist
      - name: Install tmux
        run: sudo apt-get install -y -q tmux >/dev/null
      - name: Install, verify, and remove in Debian, Ubuntu, and Alpine
        env:
          QA_OUT: ${{ runner.temp }}/qa
        run: tools/qa.sh userland dist
      - name: Trace file, process, and network use
        env:
          QA_OUT: ${{ runner.temp }}/qa
        run: tools/qa.sh isolation dist
      - name: Drive the browser in tmux and over SSH
        env:
          QA_OUT: ${{ runner.temp }}/qa
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          tar -xzf dist/xunhen_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/archive" --strip-components=1
          tools/qa.sh terminal "$RUNNER_TEMP/archive/xunhen" archive
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qa-evidence
          path: ${{ runner.temp }}/qa/
          if-no-files-found: ignore

  # The archive's own executable on the oldest kernel and CPU the release
  # claims, in a virtual machine: nix/baseline-test.nix.
  baseline:
    name: Kernel and CPU baseline
    needs: [validate, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: archive
          path: ${{ runner.temp }}/dist
      - name: Allow access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            sandbox = true
            system-features = nixos-test benchmark big-parallel kvm
      - name: Boot Linux 5.10 on a qemu64 CPU and verify the archive's executable
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/archive"
          tar -xzf "$RUNNER_TEMP/dist/xunhen_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/archive" --strip-components=1
          go_version=$(jq -r .build.go "$RUNNER_TEMP/dist/provenance.json")
          nix build -L --impure -f nix/archive-baseline.nix \
            --argstr executable "$RUNNER_TEMP/archive/xunhen" --argstr version "$VERSION" \
            --argstr commit "$COMMIT" --argstr goVersion "$go_version" 2>&1 | tee "$RUNNER_TEMP/logs/baseline.log"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: baseline-logs
          path: ${{ runner.temp }}/logs/
          if-no-files-found: ignore

  stage:
    name: Stage the draft release
    needs: [validate, archive, nix, arch, qa, baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job with write access here. It runs no repository code: it
    # checks hashes, reads the release notes, and uploads the verified bytes.
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE: ${{ needs.validate.outputs.release }}
      SUMS: ${{ needs.archive.outputs.sums }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: archive
          path: dist
      # The bytes must be the ones the archive job built and verified.
      - name: Check the handoff
        run: |
          set -euo pipefail
          [[ $(sha256sum dist/SHA256SUMS.txt | cut -d' ' -f1) == "$SUMS" ]]
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)
          expected=("provenance.json" "SHA256SUMS.txt" "xunhen_${VERSION}_linux_amd64.tar.gz" "xunhen_${VERSION}_source.tar.gz")
          [[ $(find dist -type f -printf '%f\n' | sort) == $(printf '%s\n' "${expected[@]}" | sort) ]]
      - name: Write the release notes
        run: |
          set -euo pipefail
          if [[ -z $TAG ]]; then
            printf 'Rehearsal of the release workflow for %s. Not a release.\n' "$COMMIT" >notes.md
            exit 0
          fi
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$TAG" -H "Accept: application/vnd.github.raw" >CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\] - " { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          test -s notes.md
      # A tagged release names its existing tag. A rehearsal's draft names
      # the commit instead; GitHub creates a draft's tag only when it is
      # published, and a rehearsal is never published.
      - name: Create the draft release
        run: |
          set -euo pipefail
          options=(--draft --title "xunhen $VERSION" --notes-file notes.md)
          if [[ -n $TAG ]]; then
            options+=(--verify-tag)
          else
            options+=(--target "$COMMIT")
          fi
          [[ $VERSION == *-* ]] && options+=(--prerelease)
          gh release create "$RELEASE" "${options[@]}" dist/xunhen_*.tar.gz dist/SHA256SUMS.txt dist/provenance.json
      - name: Check the uploaded bytes
        run: |
          set -euo pipefail
          gh release download "$RELEASE" --dir uploaded
          for file in dist/*; do cmp "$file" "uploaded/${file##*/}"; done
