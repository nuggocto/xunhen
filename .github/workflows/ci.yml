name: CI

on:
  push:
    branches: [shrek]
  pull_request:
    branches: [shrek]
  workflow_dispatch:
  # The release workflow runs these same checks on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job builds the supported configuration with the toolchain go.mod
# names and never touches the network for modules it has not verified.
env:
  GOENV: "off"
  GOWORK: "off"
  GOTOOLCHAIN: local
  GOOS: linux
  GOARCH: amd64
  GOAMD64: v1
  CGO_ENABLED: "0"
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: Correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z --cached --others --exclude-standard -- '*.go' ':(glob,exclude)**/testdata/**' |
            xargs -0 -r gofmt -l --)
          if [[ -n "$unformatted" ]]; then
            printf 'Format these files with gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Verify module metadata and dependencies
        run: |
          go mod tidy -diff
          go mod verify
          go -C tools/vulncheck mod tidy -diff
          go -C tools/vulncheck mod verify
      # The tests include the Neovim oracle corpus, the terminal tests on a
      # pseudo-terminal, and the fuzz targets' stored inputs.
      - name: Test
        run: go test -count=1 -timeout=5m ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o bin/xunhen ./cmd/xunhen
      - name: Check the build is static
        run: |
          if ! file bin/xunhen | grep -q 'statically linked'; then
            file bin/xunhen >&2
            exit 1
          fi
      # The checks a release archive, the Nix package, and the Arch package
      # pass, run against this build. A build from a checkout reports the
      # pseudo-version Go derives from the commit, and that commit.
      - name: Verify the executable
        run: |
          version=$(go version -m bin/xunhen | awk '$1 == "mod" { print $3 }')
          go run ./tools/verify -binary bin/xunhen -version "$version" -commit "$(git rev-parse HEAD)" -go "$(go env GOVERSION)"
      - name: Check third-party notices are current
        env:
          GOFLAGS: ""
        run: tools/release.sh notices -check
      - name: Check for generated changes
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    # The race detector needs cgo and a C compiler to run the tests. The
    # release build stays static; this job never produces it.
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the C compiler
        run: cc --version
      - name: Test with the race detector
        run: go test -race -count=1 -timeout=10m ./...

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz every target for about 10 seconds
        run: tools/fuzz.sh smoke
      # A failing input is small and synthetic: keep it for reproduction.
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-failures
          path: internal/*/testdata/fuzz/
          retention-days: 30
          if-no-files-found: ignore

  vulnerabilities:
    name: Vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # tools/vulncheck pins govulncheck and its dependencies by checksum.
      # It analyzes the source for the release configuration above and
      # reports only vulnerable code the command can reach.
      - name: Check reachable vulnerabilities
        run: go -C tools/vulncheck tool govulncheck -C ../.. ./...

  release-build:
    name: Reproducible release build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    # The release tool refuses a preset GOFLAGS and sets its own
    # environment, so this job clears the workflow's.
    env:
      GOFLAGS: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the snapshot artifacts twice and compare them
        run: tools/reproduce.sh .local/reproduce
      - name: Verify the binary archive
        run: |
          dir=.local/reproduce/first
          version=$(jq -r .version "$dir/provenance.json")
          go run ./tools/verify -archive "$dir/xunhen_${version}_linux_amd64.tar.gz" -sums "$dir/SHA256SUMS.txt" \
            -version "v$version" -commit "$(git rev-parse HEAD)" -go "$(go env GOVERSION)"

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The NixOS check boots a virtual machine, which needs KVM.
      - name: Allow access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            sandbox = true
            system-features = nixos-test benchmark big-parallel kvm
      # Every check in the sandbox: the package build, which runs the whole
      # test suite; tools/verify against the packaged executable; and a
      # NixOS machine that installs it through environment.systemPackages.
      # A stale vendorHash fails here.
      - name: Check the flake
        run: nix flake check -L
