name: CI

on:
  push:
    branches: [shrek]
  pull_request:
    branches: [shrek]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GOENV: "off"
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z --cached --others --exclude-standard -- '*.go' ':(glob,exclude)**/testdata/**' |
            xargs -0 -r gofmt -l --)
          if [[ -n "$unformatted" ]]; then
            printf 'Format these files with gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Verify module metadata and dependencies
        run: |
          go mod tidy -diff
          go mod verify
      - name: Test
        run: go test -count=1 -timeout=3m ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o bin/xunhen ./cmd/xunhen
      - name: Check for generated changes
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
