name: Linux

on:
  push:
    branches: [shrek]
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.4
          cache: false
      - name: Install syscall tracer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace=6.8-0ubuntu2
      - run: mise run check-all
