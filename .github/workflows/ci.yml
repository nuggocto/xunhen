name: Linux

on:
  push:
    branches: [shrek]
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.4
          cache: false
      - name: Install syscall tracer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace=6.8-0ubuntu2
      - run: mise run check-all
