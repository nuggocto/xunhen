min_version = "2026.9.4"

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"cargo:cargo-audit" = "0.22.1"
"cargo:cargo-deny" = "0.19.4"

[tasks]
fmt = "cargo fmt --all"
lint = "cargo clippy --locked --all-targets -- -D warnings"
test = "cargo test --locked"
fuzz-check = "cargo check --locked --manifest-path fuzz/Cargo.toml --bins"
build = "cargo build --locked --release"
audit = "cargo audit"
deny = "cargo deny --locked check"

[tasks.isolation]
depends = ["build"]
run = '''
tracer="${XUNHEN_STRACE:-$(command -v strace || true)}"
if [ -z "$tracer" ]; then
  echo "strace unavailable; syscall isolation check skipped"
  exit 0
fi
XUNHEN_STRACE="$tracer" XUNHEN_BINARY="$PWD/target/release/xunhen" cargo test --locked --test tui repository_journey_attempts_no_network_or_repository_write -- --ignored --exact
'''

[tasks.check-all]
run = [
  "cargo fmt --all -- --check",
  "mise run lint",
  "mise run test",
  "mise run fuzz-check",
  "mise run audit",
  "mise run deny",
  "mise run build",
  'XUNHEN_BINARY="$PWD/target/release/xunhen" cargo test --locked --test tui',
  "mise run isolation",
]
