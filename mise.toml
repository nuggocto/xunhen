[tools]
go = "1.27.1"

[env]
GOENV = "off"
GOWORK = "off"
GOTOOLCHAIN = "local"

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Fail if any Go file needs gofmt"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  printf 'Format these files with gofmt:\n%s\n' "$unformatted" >&2
  exit 1
fi
'''

[tasks.test]
description = "Run tests"
run = "go test -count=1 -timeout=3m ./..."

[tasks.race]
description = "Run tests with the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race -count=1 -timeout=3m ./..."

[tasks.fuzz]
description = "Run short decoder, history, replay text, diff, discovery, and terminal text fuzz checks"
run = [
  "go test ./internal/undofile -run='^$' -fuzz='^FuzzDecode$' -fuzztime=10s -parallel=2 -timeout=30s",
  "go test ./internal/history -run='^$' -fuzz='^FuzzHistory$' -fuzztime=10s -parallel=2 -timeout=30s",
  "go test ./internal/history -run='^$' -fuzz='^FuzzText$' -fuzztime=10s -parallel=2 -timeout=30s",
  "go test ./internal/diff -run='^$' -fuzz='^FuzzLines$' -fuzztime=10s -parallel=2 -timeout=30s",
  "go test ./internal/discover -run='^$' -fuzz='^FuzzNames$' -fuzztime=10s -parallel=2 -timeout=30s",
  "go test ./internal/discover -run='^$' -fuzz='^FuzzChoose$' -fuzztime=10s -parallel=2 -timeout=30s",
  "go test ./internal/termtext -run='^$' -fuzz='^FuzzClip$' -fuzztime=10s -parallel=2 -timeout=30s",
]

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.build]
description = "Build bin/xunhen"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/xunhen ./cmd/xunhen"

[tasks.check]
description = "Check formatting and run tests, vet, and build"
depends = ["fmt-check", "test", "vet", "build"]
