[tools]
go = "1.27.1"

[env]
GOENV = "off"
GOWORK = "off"
GOTOOLCHAIN = "local"

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Fail if any Go file needs gofmt"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  printf 'Format these files with gofmt:\n%s\n' "$unformatted" >&2
  exit 1
fi
'''

[tasks.test]
description = "Run tests"
run = "go test -count=1 -timeout=5m ./..."

[tasks.race]
description = "Run tests with the race detector"
env = { CGO_ENABLED = "1" }
run = "go test -race -count=1 -timeout=10m ./..."

[tasks.vulncheck]
description = "Check for reachable known vulnerabilities with the pinned govulncheck"
env = { GOOS = "linux", GOARCH = "amd64", CGO_ENABLED = "0" }
run = "go -C tools/vulncheck tool govulncheck -C ../.. ./..."

[tasks.fuzz]
description = "Run the short fuzz campaign: every target for about 10 seconds"
run = "tools/fuzz.sh smoke"

[tasks.fuzz-extended]
description = "Run the long fuzz campaign: every target for about 15 minutes"
run = "tools/fuzz.sh extended"

[tasks.measure]
description = "Measure the command and browser on the generated workloads"
run = "tools/measure.sh"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.build]
description = "Build bin/xunhen"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o bin/xunhen ./cmd/xunhen"

[tasks.notices]
description = "Fail if THIRD_PARTY_NOTICES.txt no longer matches the modules linked into xunhen"
run = "tools/release.sh notices -check"

[tasks.reproduce]
description = "Build the release archives twice from clean clones of HEAD and compare them"
run = "tools/reproduce.sh"

[tasks.release]
description = "Build the release artifacts for HEAD into dist/ (pass -tag vX.Y.Z for a release)"
run = "tools/release.sh build"

[tasks.check]
description = "Check formatting and run tests, vet, and build"
depends = ["fmt-check", "test", "vet", "build"]
